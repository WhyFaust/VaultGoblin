name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    env:
      CODEX_HOME: ${{ github.workspace }}/../vaultgoblin-plugin
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm install --global @openai/codex@0.157.1
      - run: codex plugin marketplace add . --json
      - run: codex plugin add vaultgoblin@vaultgoblin --json > installed-plugin.json
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          installed = json.loads(Path('installed-plugin.json').read_text(encoding='utf-8'))
          root = Path(installed['installedPath'])
          assert installed['pluginId'] == 'vaultgoblin@vaultgoblin', installed
          assert (root / 'skills/codex-shared-knowledge/scripts/plugin_setup.py').is_file()
          assert (root / 'skills/vaultgoblin-setup/SKILL.md').is_file()
          assert (root / 'hooks/hooks.json').is_file()
          PY

  pipeline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r pipeline/requirements.txt
      - run: python -X utf8 -m pytest -q
        working-directory: pipeline

  shared-knowledge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -W error::EncodingWarning -X warn_default_encoding -m unittest discover -s skills/codex-shared-knowledge/tests -v
      - if: runner.os == 'Linux'
        run: |
          python -m pip install -r skills/codex-shared-knowledge/requirements-watch.txt
          python skills/codex-shared-knowledge/tests/check_memory_watcher.py
          python skills/codex-shared-knowledge/tests/check_watcher_safety.py -q
