name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dataweave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r dataweave/requirements.txt
      - run: python -m pytest -q
        working-directory: dataweave

  shared-knowledge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s codex-shared-knowledge/tests -v
